name: Binary Ninja

on:
  push:
    branches: [main]
    paths:
      - "__init__.py"
      - "plugin.json"
      - "pyproject.toml"
      - "requirements.txt"
      - "mcrit_similarity/**"
      - "tests/**"
      - ".github/workflows/binaryninja.yml"
  schedule:
    # Nightly, so the dev channel is checked as it changes.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Binary Ninja channel to test
        type: choice
        options: [both, stable, dev]
        default: both

permissions:
  contents: read

# A named or computer license allows one running instance at a time: runs of this workflow
# queue behind each other, and the matrix below runs one job at a time.
concurrency:
  group: binaryninja-license
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.platform }} (${{ matrix.channel }})
    # Only the default branch uses the license; pull request code never runs with it.
    if: github.ref == 'refs/heads/main'
    environment: binaryninja
    runs-on: ${{ vars[matrix.runner_variable] || matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.channel == 'dev' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [linux-x64, linux-arm64, macos, windows, linux-x64-headless]
        # Pushes test the stable release; nightly and manual runs add the dev channel.
        channel: ${{ fromJSON(github.event_name == 'push' && '["stable"]' || inputs.channel == 'stable' && '["stable"]' || inputs.channel == 'dev' && '["dev"]' || '["stable", "dev"]') }}
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            runner_variable: BN_RUNNER_LINUX_X64
            secret_suffix: LINUX_X64
            license_secret: BN_LICENSE_B64
          # A headless serial downloads the current Linux x86_64 build of the channel, and that
          # build only accepts the headless license, which has no Binary Similarity. This job
          # tracks new builds without URL upkeep; the similarity tests run on the other jobs.
          - platform: linux-x64-headless
            os: ubuntu-24.04
            runner_variable: BN_RUNNER_LINUX_X64
            secret_suffix: NONE
            license_secret: BN_HEADLESS_LICENSE_B64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            runner_variable: BN_RUNNER_LINUX_ARM64
            secret_suffix: LINUX_ARM64
            license_secret: BN_LICENSE_B64
          - platform: macos
            os: macos-15
            runner_variable: BN_RUNNER_MACOS
            secret_suffix: MACOS
            license_secret: BN_LICENSE_B64
          - platform: windows
            os: windows-2025
            runner_variable: BN_RUNNER_WINDOWS
            secret_suffix: WINDOWS
            license_secret: BN_LICENSE_B64

    steps:
      # Secrets cannot appear in `if:`; only these booleans leave this step.
      - name: Check configuration
        id: config
        shell: bash
        env:
          HAS_LICENSE: ${{ secrets[matrix.license_secret] != '' }}
          HAS_SERIAL: ${{ secrets.BN_SERIAL != '' }}
          HAS_URL: ${{ secrets[format('BN_DOWNLOAD_URL_{0}_{1}', matrix.secret_suffix, matrix.channel == 'dev' && 'DEV' || 'STABLE')] != '' }}
          PLATFORM: ${{ matrix.platform }}
          LICENSE_SECRET: ${{ matrix.license_secret }}
        run: |
          if [[ "$HAS_LICENSE" != true ]]; then
            method=none reason="$LICENSE_SECRET is not set"
          elif [[ "$PLATFORM" == linux-x64-headless ]]; then
            if [[ "$HAS_SERIAL" == true ]]; then method=serial; else method=none reason="BN_SERIAL is not set"; fi
          elif [[ "$HAS_URL" == true && "$PLATFORM" == linux-* ]]; then
            method=url
          elif [[ "$HAS_URL" == true ]]; then
            method=installer
          else
            method=none reason="no download for this platform and channel is configured"
          fi
          echo "method=$method" >> "$GITHUB_OUTPUT"
          if [[ "$method" == none ]]; then echo "::notice::Skipping $PLATFORM: $reason"; fi

      - name: Checkout
        if: steps.config.outputs.method != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-binary-ninja links the API into this interpreter's user site-packages.
      - name: Set up Python
        if: steps.config.outputs.method != 'none'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.config.outputs.method != 'none'
        run: python -m pip install -e ".[dev]"

      # The serial only reaches this pinned action; it downloads into RUNNER_TEMP, which the
      # runner empties at the start and end of every job. Nothing is cached or uploaded.
      - name: Set up Binary Ninja
        if: steps.config.outputs.method == 'url' || steps.config.outputs.method == 'serial'
        uses: Vector35/setup-binary-ninja@c1414a20628fc677da240f19c366f3c8b06d1d68 # main, 2026-02-24 (node20)
        with:
          license: ${{ steps.config.outputs.method == 'serial' && secrets.BN_SERIAL || '' }}
          download-url: ${{ steps.config.outputs.method == 'url' && secrets[format('BN_DOWNLOAD_URL_{0}_{1}', matrix.secret_suffix, matrix.channel == 'dev' && 'DEV' || 'STABLE')] || '' }}
          dev-branch: ${{ matrix.channel == 'dev' }}

      # The action only unzips, and the macOS and Windows downloads are a DMG and an installer.
      - name: Download Binary Ninja
        if: steps.config.outputs.method == 'installer'
        shell: bash
        env:
          DOWNLOAD_URL: ${{ secrets[format('BN_DOWNLOAD_URL_{0}_{1}', matrix.secret_suffix, matrix.channel == 'dev' && 'DEV' || 'STABLE')] }}
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/binaryninja-download" "$DOWNLOAD_URL"

      - name: Set up Binary Ninja (macOS)
        if: steps.config.outputs.method == 'installer' && runner.os == 'macOS'
        shell: bash
        run: |
          mount="$RUNNER_TEMP/binaryninja-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$RUNNER_TEMP/binaryninja-download" >/dev/null
          mkdir -p "$RUNNER_TEMP/binaryninja"
          cp -R "$mount/Binary Ninja.app" "$RUNNER_TEMP/binaryninja/"
          hdiutil detach "$mount" >/dev/null
          site="$(python -m site --user-site)"
          mkdir -p "$site"
          echo "$RUNNER_TEMP/binaryninja/Binary Ninja.app/Contents/Resources/python" > "$site/binaryninja.pth"

      # 7-Zip unpacks NSIS installers without running them; otherwise fall back to a silent install.
      - name: Set up Binary Ninja (Windows)
        if: steps.config.outputs.method == 'installer' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "binaryninja-download.exe"
          Rename-Item (Join-Path $env:RUNNER_TEMP "binaryninja-download") $installer
          $install = Join-Path $env:RUNNER_TEMP "binaryninja"
          & 7z x $installer "-o$install" -y | Out-Null
          $api = Get-ChildItem -Path $install -Recurse -Filter "binaryninjacore.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $api) {
              Write-Host "7-Zip did not yield an installation; running the installer silently"
              Remove-Item -Recurse -Force $install -ErrorAction SilentlyContinue
              foreach ($args in @(@("/S", "/D=$install"), @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$install"))) {
                  $p = Start-Process -FilePath $installer -ArgumentList $args -PassThru
                  if (-not $p.WaitForExit(600000)) { $p.Kill() }
                  $api = Get-ChildItem -Path $install -Recurse -Filter "binaryninjacore.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($api) { break }
              }
          }
          if (-not $api) {
              Write-Host "Top-level contents of the download:"
              & 7z l $installer | Select-Object -First 40
              throw "no Binary Ninja installation found after extraction"
          }
          $root = $api.DirectoryName
          Write-Host "Binary Ninja core at $root"
          $site = (python -m site --user-site).Trim()
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          Set-Content -Path (Join-Path $site "binaryninja.pth") -Value (Join-Path $root "python")

      # The secret is base64, so GitHub only redacts that form; register every decoded field too.
      # A workflow command is one line, so a value with a line break is refused, never printed.
      - name: Mask license fields
        if: steps.config.outputs.method != 'none'
        shell: python
        env:
          BN_LICENSE_B64: ${{ secrets[matrix.license_secret] }}
        run: |
          import base64, json, os, sys
          entries = json.loads(base64.b64decode(os.environ["BN_LICENSE_B64"]))
          for entry in entries if isinstance(entries, list) else [entries]:
              for key, value in entry.items():
                  if not isinstance(value, str) or not value or key in ("product", "type"):
                      continue
                  if "\n" in value or "\r" in value:
                      sys.exit(f"license field {key!r} spans lines and cannot be masked")
                  print(f"::add-mask::{value}")

      - name: Pytest (real Binary Ninja)
        if: steps.config.outputs.method != 'none'
        env:
          MCRIT_TEST_REAL_BINARYNINJA: "1"
          BN_LICENSE_B64: ${{ secrets[matrix.license_secret] }}
        run: python -m pytest tests -p no:cacheprovider --tb=short

      # The headless license has no Binary Similarity, and linux-x64 runs the end-to-end tests
      # against MongoDB-backed MCRIT in the job below instead of the in-memory launcher.
      - name: Install MCRIT server
        if: steps.config.outputs.method != 'none' && matrix.platform != 'linux-x64-headless' && matrix.platform != 'linux-x64'
        run: python -m pip install -e ".[dev,e2e]"

      - name: Pytest end-to-end (launched MCRIT server)
        if: steps.config.outputs.method != 'none' && matrix.platform != 'linux-x64-headless' && matrix.platform != 'linux-x64'
        timeout-minutes: 15
        env:
          MCRIT_TEST_REAL_BINARYNINJA: "1"
          MCRIT_TEST_E2E: "1"
          BN_LICENSE_B64: ${{ secrets[matrix.license_secret] }}
        run: python -m pytest tests -m e2e -p no:cacheprovider --tb=short

      # Self-hosted runners keep the user site-packages between jobs.
      - name: Unlink Binary Ninja
        if: always() && steps.config.outputs.method != 'none'
        shell: python
        run: |
          import os, site
          path = os.path.join(site.getusersitepackages(), "binaryninja.pth")
          if os.path.exists(path):
              os.remove(path)

  # linux-x64 runs the same end-to-end tests against MCRIT in its deployed shape: every server
  # the tests launch is MongoDB-backed and gets a worker process of its own. A service container
  # is job-wide, so this cannot be a step of the matrix above, which also covers macOS and Windows.
  e2e-mongodb:
    name: linux-x64 end-to-end (MongoDB, ${{ matrix.channel }})
    # One license, one running instance: this job must not overlap the matrix above. !cancelled()
    # still runs it after a continue-on-error dev failure, but not after a cancelled run.
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    environment: binaryninja
    runs-on: ${{ vars.BN_RUNNER_LINUX_X64 || 'ubuntu-24.04' }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.channel == 'dev' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(github.event_name == 'push' && '["stable"]' || inputs.channel == 'stable' && '["stable"]' || inputs.channel == 'dev' && '["dev"]' || '["stable", "dev"]') }}

    services:
      mongo:
        image: mongo:8
        ports:
          # Not the default port: a self-hosted runner may run a MongoDB of its own, and the
          # tests call POST /respawn, which empties the whole database.
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check configuration
        id: config
        shell: bash
        env:
          HAS_LICENSE: ${{ secrets.BN_LICENSE_B64 != '' }}
          HAS_URL: ${{ secrets[format('BN_DOWNLOAD_URL_LINUX_X64_{0}', matrix.channel == 'dev' && 'DEV' || 'STABLE')] != '' }}
        run: |
          if [[ "$HAS_LICENSE" == true && "$HAS_URL" == true ]]; then method=url; else method=none; fi
          echo "method=$method" >> "$GITHUB_OUTPUT"
          if [[ "$method" == none ]]; then echo "::notice::Skipping: no license or download URL"; fi

      - name: Checkout
        if: steps.config.outputs.method != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.config.outputs.method != 'none'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        if: steps.config.outputs.method != 'none'
        run: python -m pip install -e ".[dev,e2e]"

      - name: Set up Binary Ninja
        if: steps.config.outputs.method != 'none'
        uses: Vector35/setup-binary-ninja@c1414a20628fc677da240f19c366f3c8b06d1d68 # main, 2026-02-24 (node20)
        with:
          download-url: ${{ secrets[format('BN_DOWNLOAD_URL_LINUX_X64_{0}', matrix.channel == 'dev' && 'DEV' || 'STABLE')] }}
          dev-branch: ${{ matrix.channel == 'dev' }}

      - name: Mask license fields
        if: steps.config.outputs.method != 'none'
        shell: python
        env:
          BN_LICENSE_B64: ${{ secrets.BN_LICENSE_B64 }}
        run: |
          import base64, json, os, sys
          entries = json.loads(base64.b64decode(os.environ["BN_LICENSE_B64"]))
          for entry in entries if isinstance(entries, list) else [entries]:
              for key, value in entry.items():
                  if not isinstance(value, str) or not value or key in ("product", "type"):
                      continue
                  if "\n" in value or "\r" in value:
                      sys.exit(f"license field {key!r} spans lines and cannot be masked")
                  print(f"::add-mask::{value}")

      # MCRIT reads its MongoDB settings from dataclass defaults, so the launcher sets them
      # from these; the test fixtures start and stop every server and worker themselves.
      - name: Pytest end-to-end (MongoDB-backed MCRIT)
        if: steps.config.outputs.method != 'none'
        timeout-minutes: 20
        env:
          MCRIT_TEST_REAL_BINARYNINJA: "1"
          MCRIT_TEST_E2E: "1"
          MCRIT_E2E_STORAGE: mongodb
          MCRIT_E2E_MONGO_PORT: "27018"
          MCRIT_E2E_MONGO_DB: mcrit_e2e_${{ github.run_id }}
          BN_LICENSE_B64: ${{ secrets.BN_LICENSE_B64 }}
        run: python -m pytest tests -m e2e -p no:cacheprovider --tb=short

      # Self-hosted runners keep the user site-packages between jobs.
      - name: Unlink Binary Ninja
        if: always() && steps.config.outputs.method != 'none'
        shell: python
        run: |
          import os, site
          path = os.path.join(site.getusersitepackages(), "binaryninja.pth")
          if os.path.exists(path):
              os.remove(path)
