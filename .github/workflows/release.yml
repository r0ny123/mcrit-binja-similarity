name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release for it. The tag must match the version in
# pyproject.toml, plugin.json and mcrit_similarity/__init__.py, and CHANGELOG.md must have a dated
# section for it; that section becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    name: Check version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME"

  validate:
    needs: notes
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Write release notes
        run: python .github/scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      # Releases are immutable once published, so everything is checked before this step.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
